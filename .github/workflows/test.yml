name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Install clipboard dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Run tests
        run: go test -race -count=1 ./...
